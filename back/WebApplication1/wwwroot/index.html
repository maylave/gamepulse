<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Пользователи</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .loading {
            color: #666;
        }
    </style>
</head>
<body>
    <h2>Список пользователей (TOP 1000)</h2>
    <div id="content" class="loading">Загрузка...</div>

    <script>
        fetch('/api/users')
            .then(response => response.json())
            .then(users => {
                if (users.error) {
                    document.getElementById('content').innerHTML = '<p style="color:red;">Ошибка: ' + users.error + '</p>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Имя</th>
                                <th>Email</th>
                                <th>Пароль</th>
                                <th>Возраст</th>
                            </tr>
                        </thead>
                        <tbody>`;

                users.forEach(user => {
                    html += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.password}</td>
                            <td>${user.age}</td>
                        </tr>`;
                });

                html += `
                        </tbody>
                    </table>`;

                document.getElementById('content').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('content').innerHTML = '<p style="color:red;">Не удалось загрузить данные.</p>';
                console.error(err);
            });
    </script>
</body>
</html>
